name: CI

# Every pull request gets the full check suite before it can merge to main.
# Pushes to main re-run tests inside the Deploy workflow, so this only
# needs to cover PRs.

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
