name: Deploy

# Trunk-based deployment: every push to main that passes the tests ships to
# the official site, https://runlogapp.com (Cloudflare Pages project `runlog`,
# still reachable at runlog-aul.pages.dev). Requires the CLOUDFLARE_API_TOKEN
# repository secret — an API token with the "Cloudflare Pages: Edit" permission.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # A DSN is a write-only key and is baked into the bundle, so it is a
      # repository variable rather than a secret. A fork without it builds an
      # app that reports nothing and asks nobody for consent.
      - run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
      # `--branch` is not optional here. Left off, wrangler infers the branch
      # from git, and a checkout in Actions is a detached HEAD — so the upload
      # can be filed as a preview deployment while the job still reports
      # success, leaving the site on the previous build with nothing red to
      # show for it. Naming the production branch makes what runlogapp.com
      # serves a fact about this file rather than about the checkout.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c99cdfaf910278bc8a4cdddac9fa559b
          command: pages deploy dist --project-name=runlog --branch=main
