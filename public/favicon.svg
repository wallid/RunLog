<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Run Log">
  <!--
    The same mark the headers draw — see src/shell/BrandMark.tsx, which is the
    original and carries the reasoning. Kept in step with it by hand: two
    files rather than one because this has to be a static asset the browser
    can fetch before any JavaScript runs, and because the app's version tints
    with `currentColor` while a favicon has to name every colour itself.

    The geometry is the component's, unchanged, so the tab and the page agree.
    Two treads and an 8-unit stroke are what survive being 16 px across: a
    64-unit viewBox divides by four there, which leaves four pixels between
    risers, and a third tread would close that to three and silt up.

    The tile is filled rather than transparent. Safari and the Windows task
    bar both put this on backgrounds of their own choosing, and a dark stroke
    on an unknown ground is a coin toss.
  -->
  <rect width="64" height="64" rx="14" fill="#f4f3f1" />
  <path
    d="M14 48 H29 V33 H44 V22"
    fill="none"
    stroke="#17171a"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="44" cy="22" r="9.5" fill="#fc5200" />
</svg>
